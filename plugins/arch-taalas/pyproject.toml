[project]
name = "llmchip-arch"
version = "0.1.0"
description = "Taalas-style hardwired architecture template of llmchip-harness (requirements FR-ARC)"
requires-python = ">=3.12"
dependencies = ["llmchip-sdk", "llmchip-numeric", "llmchip-estimator"]

[tool.uv.sources]
llmchip-sdk = { workspace = true }
llmchip-numeric = { workspace = true }
llmchip-estimator = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
