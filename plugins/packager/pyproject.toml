[project]
name = "llmchip-packager"
version = "0.1.0"
description = "Tapeout package builder and integrity check of llmchip-harness (requirements FR-PKG)"
requires-python = ">=3.12"
dependencies = ["llmchip-sdk"]

[tool.uv.sources]
llmchip-sdk = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
