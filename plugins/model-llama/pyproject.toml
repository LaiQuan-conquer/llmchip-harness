[project]
name = "llmchip-model"
version = "0.1.0"
description = "Llama-family model intake and the L0 FP32 reference of llmchip-harness (requirements FR-MDL)"
requires-python = ">=3.12"
dependencies = ["llmchip-sdk", "numpy>=2.0"]

[tool.uv.sources]
llmchip-sdk = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
