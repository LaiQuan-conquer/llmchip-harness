[project]
name = "llmchip-rtl"
version = "0.1.0"
description = "RTL generator for the Taalas-style vector engine of llmchip-harness (requirements FR-RTL)"
requires-python = ">=3.12"
dependencies = ["llmchip-sdk", "llmchip-numeric", "numpy>=2.0"]

[tool.uv.sources]
llmchip-sdk = { workspace = true }
llmchip-numeric = { workspace = true }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
