# uv workspace of the Python parts of llmchip-harness: the plugin SDK
# and the virtual-chip test harness (python/), and Python plugins (plugins/). See AGENTS.md "Engineering".
[project]
name = "llmchip-harness-python"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["llmchip-sdk", "llmchip-estimator", "llmchip-model", "llmchip-numeric", "llmchip-arch", "llmchip-rtl", "llmchip-vchip", "llmchip-vchip-plugin"]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.14",
]

[tool.uv]
package = false

[tool.uv.sources]
llmchip-sdk = { workspace = true }
llmchip-estimator = { workspace = true }
llmchip-model = { workspace = true }
llmchip-numeric = { workspace = true }
llmchip-arch = { workspace = true }
llmchip-rtl = { workspace = true }
llmchip-vchip = { workspace = true }
llmchip-vchip-plugin = { workspace = true }
# PyTorch: the official implementation recovered graphs are compared against (model-llama), the L0 of
# the benchmarks, the fast L2 and the calibration (numeric). CUDA 13 build on Linux x86-64 (it falls
# back to the CPU where there is no GPU), CPU build elsewhere.
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
  { index = "pytorch-cpu", marker = "sys_platform != 'linux' or platform_machine != 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.workspace]
members = ["python/llmchip-sdk", "plugins/estimator", "plugins/model-llama", "plugins/numeric", "plugins/arch-taalas", "plugins/rtl-taalas", "python/llmchip-vchip", "plugins/vchip"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["python", "plugins"]
addopts = "--import-mode=importlib"
